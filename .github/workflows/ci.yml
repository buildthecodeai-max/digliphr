name: Employee Management CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: employee_management
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=12
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, gd, curl
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/run.php
      - run: mysql --host=127.0.0.1 --port=3306 --user=root --password=root employee_management < database/schema.sql
      - run: php bin/migrate.php --dry-run
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: employee_management
          DB_USERNAME: root
          DB_PASSWORD: root
