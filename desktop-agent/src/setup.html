<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>Diglip Work Monitor — Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #1e3a5f;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(30,58,95,0.12);
      padding: 36px 32px 28px;
      width: 360px;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e3a5f;
    }
    .logo p {
      font-size: 13px;
      color: #6b7a99;
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e3a5f;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d0d8e8;
      border-radius: 6px;
      font-size: 14px;
      color: #1e3a5f;
      background: #fff;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #1e3a5f; }
    .btn {
      width: 100%;
      padding: 10px;
      background: #1e3a5f;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: 4px;
    }
    .btn:hover { background: #162d4a; }
    .btn:disabled { background: #8fa5c0; cursor: default; }
    .error {
      background: #fff0f0;
      border: 1px solid #f5c6cb;
      color: #c0392b;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .note {
      font-size: 12px;
      color: #8fa5c0;
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
      color: #c0cce0;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e4eaf3;
    }
    .btn-secondary {
      background: #fff;
      color: #1e3a5f;
      border: 1.5px solid #d0d8e8;
    }
    .btn-secondary:hover { background: #f4f6f9; }
    .btn-secondary:disabled { color: #8fa5c0; cursor: default; background: #f9fbfd; }
    .status-msg {
      text-align: center;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: none;
    }
    .status-msg.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .status-msg.ok   { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Diglip Work Monitor</h1>
      <p>Sign in with your Diglip employee account</p>
    </div>
    <div class="error" id="err"></div>
    <label for="email">Work Email</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btn" onclick="doLogin()">Sign In & Activate</button>

    <div class="divider">or</div>

    <div class="status-msg" id="webStatus"></div>
    <button class="btn btn-secondary" id="webBtn" onclick="doWebConnect()">Connect via Web Session</button>
    <p class="note">Already logged into the web portal? Click above to connect without a password.</p>
  </div>
  <script>
    const { ipcRenderer } = require('electron');

    // Pre-fill saved email if any
    ipcRenderer.invoke('setup:get-email').then(e => { if (e) document.getElementById('email').value = e; });

    function showErr(msg) {
      const el = document.getElementById('err');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideErr() {
      document.getElementById('err').style.display = 'none';
    }

    async function doLogin() {
      hideErr();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showErr('Please enter your email and password.'); return; }
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const result = await ipcRenderer.invoke('setup:login', { email, password });
        if (result.success) {
          btn.textContent = 'Done!';
        } else {
          showErr(result.message || 'Sign-in failed. Check your credentials.');
          btn.disabled = false;
          btn.textContent = 'Sign In & Activate';
        }
      } catch (e) {
        showErr(e.message || 'Unexpected error.');
        btn.disabled = false;
        btn.textContent = 'Sign In & Activate';
      }
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    function showWebStatus(msg, type) {
      const el = document.getElementById('webStatus');
      el.textContent = msg;
      el.className = 'status-msg ' + type;
      el.style.display = 'block';
    }

    async function doWebConnect() {
      const webBtn = document.getElementById('webBtn');
      webBtn.disabled = true;
      webBtn.textContent = 'Opening browser…';
      showWebStatus('Waiting for web portal approval — approve in your browser, then return here.', 'info');

      const result = await ipcRenderer.invoke('setup:web-connect');
      if (!result.success) {
        showWebStatus(result.message || 'Failed to start web connect.', 'error');
        webBtn.disabled = false;
        webBtn.textContent = 'Connect via Web Session';
      }
    }

    ipcRenderer.on('web-connect:success', () => {
      showWebStatus('Connected successfully! Starting monitoring…', 'ok');
      document.getElementById('webBtn').textContent = 'Connected!';
    });

    ipcRenderer.on('web-connect:timeout', () => {
      showWebStatus('Timed out. Please try again.', 'error');
      const webBtn = document.getElementById('webBtn');
      webBtn.disabled = false;
      webBtn.textContent = 'Connect via Web Session';
    });

    ipcRenderer.on('web-connect:error', (_event, msg) => {
      showWebStatus(msg || 'Connection failed. Try again.', 'error');
      const webBtn = document.getElementById('webBtn');
      webBtn.disabled = false;
      webBtn.textContent = 'Connect via Web Session';
    });
  </script>
</body>
</html>
